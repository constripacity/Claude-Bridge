[build-system]
# Upper-bounded: hatchling >=1.30 emits core Metadata-Version 2.5, which
# current twine and PyPI's upload validation reject. Pin below it so an
# isolated `python -m build` produces 2.4 artifacts that upload cleanly.
# Lift the cap once PyPI/twine accept 2.5.
requires = ["hatchling>=1.27,<1.30"]
build-backend = "hatchling.build"

[project]
name = "claude-code-bridge"
description = "Local-first, cross-machine MCP relay for independent coding agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Constripacity" }]
keywords = ["mcp", "claude-code", "codex", "agent", "bridge", "relay"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]
dependencies = [
    "mcp>=1.27.0,<2",
    "starlette>=0.27.0",
    "uvicorn>=0.24.0",
    "anyio>=4.0",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
tui = [
    "textual>=0.79.0",
    "httpx>=0.27.0",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Hard per-test timeout so a hung test (e.g. a future streaming-response
    # deadlock) fails in seconds instead of burning CI's 6h job ceiling, as
    # the v0.8.0 SSE tests did before the broker-level rewrite.
    "pytest-timeout>=2.3",
    "httpx>=0.27.0",
    "ruff>=0.6",
    "textual>=0.79.0",
]

[project.urls]
Homepage = "https://github.com/constripacity/Claude-Bridge"
Repository = "https://github.com/constripacity/Claude-Bridge"
Issues = "https://github.com/constripacity/Claude-Bridge/issues"
Changelog = "https://github.com/constripacity/Claude-Bridge/blob/main/CHANGELOG.md"
Documentation = "https://github.com/constripacity/Claude-Bridge#readme"
Security = "https://github.com/constripacity/Claude-Bridge/security/policy"

[project.scripts]
claude-bridge = "claude_bridge.cli:main"

[tool.hatch.version]
path = "claude_bridge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["claude_bridge"]

[tool.hatch.build.targets.sdist]
include = [
    "/claude_bridge",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/CLAUDE.md",
    "/docs/COMPATIBILITY.md",
    "/docs/MIGRATING-0.9-TO-1.2.md",
    "/docs/PROTOCOL.md",
    "/docs/ROADMAP.md",
    "/Dockerfile",
    "/.dockerignore",
    "/server.json",
    "/package.json",
    "/package-lock.json",
    "/pyproject.toml",
    "/pytest.ini",
    "/start-bridge.bat",
    "/start-bridge.sh",
    "/start-tui.bat",
    "/start-tui.sh",
]
