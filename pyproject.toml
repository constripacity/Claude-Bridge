[build-system]
# Upper-bounded: hatchling >=1.30 emits core Metadata-Version 2.5, which
# current twine and PyPI's upload validation reject. Pin below it so an
# isolated `python -m build` produces 2.4 artifacts that upload cleanly.
# Lift the cap once PyPI/twine accept 2.5.
requires = ["hatchling>=1.27,<1.30"]
build-backend = "hatchling.build"

[project]
name = "claude-code-bridge"
description = "Real-time cross-machine MCP relay for Claude Code agents — send and receive messages across named channels."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Constripacity" }]
keywords = ["mcp", "claude-code", "agent", "bridge", "sse", "relay"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]
dependencies = [
    "mcp>=1.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.24.0",
    "anyio>=4.0",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
tui = [
    "textual>=0.79.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Hard per-test timeout so a hung test (e.g. a future streaming-response
    # deadlock) fails in seconds instead of burning CI's 6h job ceiling, as
    # the v0.8.0 SSE tests did before the broker-level rewrite.
    "pytest-timeout>=2.3",
    "httpx>=0.27.0",
    "ruff>=0.6",
    "textual>=0.79.0",
]

[project.urls]
Homepage = "https://github.com/constripacity/Claude-Bridge"
Repository = "https://github.com/constripacity/Claude-Bridge"
Issues = "https://github.com/constripacity/Claude-Bridge/issues"

[project.scripts]
claude-bridge = "claude_bridge.cli:main"

[tool.hatch.version]
path = "claude_bridge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["claude_bridge"]

[tool.hatch.build.targets.sdist]
include = [
    "/claude_bridge",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/CLAUDE.md",
    "/Dockerfile",
    "/pyproject.toml",
    "/pytest.ini",
]

[tool.ruff.lint]
# Pin the lint rule set explicitly. The project has always relied on ruff's
# historical default (E4/E7/E9/F). Because CI installs ruff unpinned, a ruff
# release that broadens the *default* rule set would otherwise turn green CI red
# on unchanged code — ruff 0.16 did exactly that by enabling I/UP/S/BLE/PL/RUF/
# PYI by default. Declaring the selection makes lint reproducible across ruff
# versions. Adopting additional rule families is a deliberate, separate change.
select = ["E4", "E7", "E9", "F"]
