name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      # Pinned to immutable SHAs. Update the SHA and trailing version comment
      # together when intentionally upgrading an action.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check claude_bridge tests

      - name: Import and version check
        run: python -c "import claude_bridge; print(f'claude_bridge {claude_bridge.__version__} import OK')"

      - name: Test
        run: python -m pytest -v

  package:
    name: Build and install package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine "jsonschema>=4.20"
          python -m build

      - name: Validate artifact metadata
        run: python -m twine check dist/*

      - name: Validate MCP Registry manifest against its dated schema
        run: |
          curl -fsSL https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json -o /tmp/mcp-server-schema.json
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator

          with open('/tmp/mcp-server-schema.json', encoding='utf-8') as source:
              schema = json.load(source)
          with open('server.json', encoding='utf-8') as source:
              manifest = json.load(source)
          errors = sorted(
              Draft202012Validator(schema).iter_errors(manifest),
              key=lambda error: list(error.path),
          )
          for error in errors:
              path = '/'.join(map(str, error.path)) or '<root>'
              print(f'{path}: {error.message}')
          raise SystemExit(bool(errors))
          PY

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/bridge-wheel
          /tmp/bridge-wheel/bin/python -m pip install dist/*.whl
          /tmp/bridge-wheel/bin/claude-bridge --version
          /tmp/bridge-wheel/bin/python -c "import claude_bridge; print(claude_bridge.__version__)"
          /tmp/bridge-wheel/bin/python -c "from importlib.resources import files; assert (files('claude_bridge') / 'web' / 'app.js').is_file()"
          /tmp/bridge-wheel/bin/python -c "from importlib.resources import files; assert (files('claude_bridge') / 'web' / 'THIRD_PARTY_NOTICES.txt').is_file()"

      - name: Install source distribution in a clean environment
        run: |
          python -m venv /tmp/bridge-sdist
          /tmp/bridge-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/bridge-sdist/bin/claude-bridge --version

  dashboard:
    name: Reproduce dashboard bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install pinned dashboard dependencies
        run: npm ci

      - name: Rebuild dashboard
        run: npm run build:dashboard

      - name: Verify committed bundle is current
        run: git diff --exit-code -- claude_bridge/web/app.js
