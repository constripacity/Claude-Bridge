name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # Pinned to commit SHA, not the floating `@v4` tag, so a compromise of
      # the tag (or a malicious force-push on it) can't silently rewrite what
      # CI runs. Bump by replacing both the SHA and the trailing comment.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with ruff
        run: ruff check claude_bridge tests/

      - name: Import check
        run: python -c "import claude_bridge; print(f'claude_bridge {claude_bridge.__version__} import OK')"

      - name: Run tests
        run: pytest -v
